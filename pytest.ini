[pytest]
testpaths = tests
bdd_features_base_dir = features

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(message)s
log_cli_date_format = %H:%M:%S

log_file = artifacts/logs/voter_check.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(funcName)s:%(lineno)d | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
